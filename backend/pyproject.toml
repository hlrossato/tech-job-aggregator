[project]
name = "technology-jobs-aggregator"
version = "0.1.0"
description = "API and ingestion pipeline for a technology jobs search engine"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "orjson>=3.10",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "scrapy>=2.12",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobboard"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["scrapy.*", "bs4.*", "itemadapter.*"]
ignore_missing_imports = true
