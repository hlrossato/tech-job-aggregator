services:
  db:
    restart: unless-stopped
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  api:
    restart: unless-stopped
    ports: !override []
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobboard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobboard}
      API_CORS_ORIGINS: '${API_CORS_ORIGINS:-["http://localhost"]}'

  frontend:
    restart: unless-stopped
    ports: !override
      - "80:80"
