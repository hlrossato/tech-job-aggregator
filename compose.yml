services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobboard}
      POSTGRES_USER: ${POSTGRES_USER:-jobboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobboard} -d ${POSTGRES_DB:-jobboard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: jobboard-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobboard}:${POSTGRES_PASSWORD:-jobboard}@db:5432/${POSTGRES_DB:-jobboard}
      API_CORS_ORIGINS: '${API_CORS_ORIGINS:-["http://localhost:5173"]}'
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  crawler:
    image: jobboard-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobboard}:${POSTGRES_PASSWORD:-jobboard}@db:5432/${POSTGRES_DB:-jobboard}
    command: ["python", "/app/scripts/crawl_sources.py", "/app/backend/sources.toml"]
    volumes:
      - ./backend/sources.toml:/app/backend/sources.toml:ro
    working_dir: /app/backend
    depends_on:
      db:
        condition: service_healthy
    profiles: ["crawler"]

  frontend:
    image: jobboard-frontend
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
