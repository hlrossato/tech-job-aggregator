server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # Docker's embedded DNS. A variable in proxy_pass forces re-resolution so a
    # restarted API container does not leave nginx holding a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api$request_uri;
    }

    location /health {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api$request_uri;
    }

    location /ready {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api$request_uri;
    }

    location / {
        try_files $uri /index.html;
    }
}
